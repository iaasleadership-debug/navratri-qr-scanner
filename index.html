<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Navratri QR Camera</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;color:#172033;margin:0}main{max-width:480px;margin:auto;padding:20px}h1{font-size:24px}label{display:block;margin:18px 0 7px;font-weight:650}input,button{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border-radius:10px;border:1px solid #bac1ce}button{background:#242c64;color:#fff;border:0;font-weight:700;margin-top:12px}button.secondary{background:#e8eaf1;color:#172033}button:disabled{opacity:.5}#reader{margin-top:14px;background:#fff;border-radius:12px;overflow:hidden}.notice{background:#fff;padding:12px;border-radius:10px;margin-top:15px;overflow-wrap:anywhere}.small{font-size:13px;color:#525b6d}#result{font-weight:700}</style></head><body><main><h1>Navratri QR Camera</h1><p class="small">Scan a ticket on your iPhone, then validate it in the existing Google Apps Script check-in app. Internet required.</p><label for="url">Existing Google Apps Script Web App URL (/exec)</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="url"><button id="start" type="button">Start QR camera</button><button id="stop" type="button" class="secondary" disabled>Stop camera</button><div id="reader"></div><div class="notice"><div id="result" role="status">Ready to scan</div><label for="code">Scanned ticket code</label><input id="code" autocomplete="off" autocapitalize="characters" placeholder="8-character ticket code"><button id="open" type="button">Open ticket for validation</button><p class="small">This camera page does not admit anyone. Only admit guests after the Google check-in app shows ENTRY ALLOWED.</p></div></main><script>const $=id=>document.getElementById(id);let scanner=null,opening=false;const stored=localStorage.getItem('navratriAppUrl');if(stored)$('url').value=stored;function setMessage(t){$('result').textContent=t}function appUrl(){const s=$('url').value.trim();try{const u=new URL(s);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!u.pathname.endsWith('/exec'))throw Error();localStorage.setItem('navratriAppUrl',u.toString());return u}catch(e){setMessage('Enter your deployed Google Apps Script /exec URL first.');return null}}async function stop(){if(!scanner)return;try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null;$('start').disabled=false;$('stop').disabled=true}async function start(){if(scanner)return;if(!appUrl())return;if(!window.isSecureContext){setMessage('Camera requires HTTPS. Open the GitHub Pages URL, not a local file.');return}if(typeof Html5Qrcode==='undefined'){setMessage('QR library did not load. Check internet connection.');return}try{scanner=new Html5Qrcode('reader',{useBarCodeDetectorIfSupported:false});$('start').disabled=true;$('stop').disabled=false;setMessage('Point the camera at a QR ticket.');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},async text=>{if(opening)return;opening=true;$('code').value=String(text).trim();setMessage('Scanned '+$('code').value+'. Open ticket for validation.');await stop();opening=false},()=>{})}catch(e){setMessage('Camera failed: '+(typeof e==='string'?e:e?.message||String(e)));await stop()}}function openTicket(){const u=appUrl();if(!u)return;const code=$('code').value.trim();if(!code){setMessage('Scan or enter a ticket code first.');return}u.searchParams.set('code',code);window.location.href=u.toString()}$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);$('open').addEventListener('click',openTicket);</script></body></html>
