<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Navratri Check-in</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#19243a;background:#f5f6fb}{box-sizing:border-box;}body{margin:0}main{max-width:550px;margin:auto;padding:18px 16px 45px}h1{font-size:25px;margin:8px 0 2px}.muted{color:#647084;font-size:13px}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 12px #17223a0d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}.stat{background:#f1f3f9;border-radius:12px;padding:12px 4px}.stat b{display:block;font-size:24px}.stat small{color:#59657a}label{font-weight:650;font-size:14px;display:block;margin:12px 0 6px}input,button{font:inherit;width:100%;border-radius:10px;padding:13px;border:1px solid #bdc5d2}button{background:#24366c;color:white;border:0;font-weight:700;cursor:pointer;margin-top:10px}button.secondary{background:#e7ebf5;color:#24366c}button:disabled{opacity:.5}#reader{width:100%;overflow:hidden;border-radius:12px}#reader video{border-radius:12px}#result{border-radius:13px;text-align:center;padding:20px;margin-top:14px;font-size:21px;font-weight:800;overflow-wrap:anywhere}.neutral{background:#e9edf5;color:#43506c}.valid{background:#d9f9e3;color:#14672c}.duplicate,.invalid{background:#ffe1e1;color:#a42020}.error{background:#fff0c5;color:#805400}.detail{font-size:13px;font-weight:500;margin-top:7px}#scannerArea{display:none}.line{display:flex;gap:10px}.line>{flex:1;min-width:0}#help{font-size:12px;color:#65728a;margin-top:8px}#scanCode{font-weight:700;letter-spacing:.04em}
</style></head><body><main><h1>Navratri Check-in</h1><div class="muted">One-screen QR scanning · Live duplicate checks</div>
<section><div class="stats"><div class="stat"><b id="total">—</b><small>Total</small></div><div class="stat"><b id="checked">—</b><small>Checked in</small></div><div class="stat"><b id="remaining">—</b><small>Remaining</small></div></div></section>
<section><label for="volunteer">Volunteer / gate</label><input id="volunteer" placeholder="e.g. Gate A – Priya" autocomplete="off"><label for="pin">Volunteer access code</label><input id="pin" type="password" inputmode="numeric" placeholder="Shared event PIN" autocomplete="off"><div id="help">PIN stays in this page's memory only. Refreshing requires re-entry.</div></section>
<section><div class="line"><button type="button" id="start" onclick="startCamera()">Start QR Camera</button><button class="secondary" id="stop" onclick="stopCamera()" disabled>Stop</button></div><div id="scannerArea"><div id="reader"></div></div><label for="code">Manual ticket code</label><input id="code" maxlength="32" autocapitalize="characters" placeholder="8-character code" onkeydown="if(event.key==='Enter')submitManual()"><button id="submit" onclick="submitManual()">Validate & Check In</button><div id="result" class="neutral" aria-live="polite">Ready to scan</div><p class="muted">Keep internet connected. Do not admit guests if a validation error occurs.</p></section>
</main><script>
// EDIT THIS ONE LINE before uploading to GitHub Pages. Do not paste your Apps Script URL here.
const WORKER_URL = 'https://navratri-ticket-checkin.iaas-leadership.workers.dev/';
const el=id=>document.getElementById(id);let scanner=null,scanning=false,busy=false,scanLocked=false,autoResume=null;
function show(type,title,detail=''){const node=el('result');node.className=type;node.textContent='';const a=document.createElement('div');a.textContent=title;node.append(a);if(detail){const b=document.createElement('div');b.className='detail';b.textContent=detail;node.append(b)}}
async function api(data){if(WORKER_URL.includes('REPLACE-WITH'))throw Error('Configure WORKER_URL in index.html first');const pin=el('pin').value.trim();if(!pin)throw Error('Enter volunteer access code');const response=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Volunteer-Pin':pin},body:JSON.stringify(data),cache:'no-store'});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'Connection failed');return result.data}
async function refresh(){if(!el('pin').value)return;try{const s=await api({action:'stats'});el('total').textContent=s.total;el('checked').textContent=s.checkedIn;el('remaining').textContent=s.remaining}catch(e){/* preserve prior totals; validation displays errors */}}
async function submitManual(){return submitCode(el('code').value)}
async function submitCode(value){if(busy)return;const code=String(value||'').trim().toUpperCase();if(!code){show('invalid','Enter ticket code');return}busy=true;scanLocked=true;el('submit').disabled=true;show('neutral','Validating…',code);try{const r=await api({action:'checkin',code,volunteer:el('volunteer').value});show(r.status,r.message,r.code+(r.time?' · '+r.time:''));el('code').value='';await refresh();if(r.status==='valid'&&navigator.vibrate)navigator.vibrate(80);if(scanning){clearTimeout(autoResume);autoResume=setTimeout(()=>{scanLocked=false;show('neutral','Ready for next ticket')},2200)}else{scanLocked=false}}catch(e){show('error','CHECK-IN NOT CONFIRMED',e.message+' — check ticket status before retrying');scanLocked=true;setTimeout(()=>{scanLocked=false},3500)}finally{busy=false;el('submit').disabled=false}}
async function startCamera(){alert("Camera");if(scanning)return;if(!el('pin').value.trim()){show('error','Enter volunteer access code');return}if(typeof Html5Qrcode==='undefined'){show('error','QR library did not load','Check your internet connection');return}el('scannerArea').style.display='block';show('neutral','Opening camera…');try{scanner=new Html5Qrcode('reader',{useBarCodeDetectorIfSupported:false});await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},(decoded)=>{if(busy||scanLocked)return;scanLocked=true;submitCode(decoded)},()=>{});scanning=true;el('start').disabled=true;el('stop').disabled=false;show('neutral','Point camera at QR ticket');refresh()}catch(e){show('error','Camera unavailable',typeof e==='string'?e:(e?.message||String(e)));el('scannerArea').style.display='none';try{if(scanner)await scanner.clear()}catch(_){}scanner=null}}
async function stopCamera(){clearTimeout(autoResume);scanLocked=false;try{if(scanner&&scanning)await scanner.stop();if(scanner)await scanner.clear()}catch(e){}scanner=null;scanning=false;el('scannerArea').style.display='none';el('start').disabled=false;el('stop').disabled=true;show('neutral','Camera stopped')}
el('pin').addEventListener('change',refresh);setInterval(refresh,20000);
</script></body></html>
